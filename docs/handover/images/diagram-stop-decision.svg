<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">When to press the Stop button</title><desc id="d">If anything involves wrong data, a leaked secret, or money, press Stop first. If it is only a small display problem, write it down and tell Ian.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">Something looks wrong. What now?</text><rect x="400" y="90" width="400" height="100" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="400" y="90" width="8" height="100" rx="4" fill="#B7791F"/><text x="428" y="132" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Does it involve…</text><text x="428" y="166" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">people’s data, money, or logins?</text><rect x="60" y="270" width="480" height="170" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="60" y="270" width="8" height="170" rx="4" fill="#C8102E"/><text x="88" y="312" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">YES: press Stop first</text><text x="88" y="346" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">1. Make the campaign inactive</text><text x="88" y="372" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">2. Set the 3 switches back to SAFE</text><text x="88" y="398" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">3. Redeploy (owner says yes first)</text><text x="88" y="424" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">4. Tell Ian, write down what you saw</text><rect x="660" y="270" width="480" height="170" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="660" y="270" width="8" height="170" rx="4" fill="#0F5C46"/><text x="688" y="312" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">NO: small display problem</text><text x="688" y="346" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">1. Take a screenshot</text><text x="688" y="372" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">2. Note the page and what you did</text><text x="688" y="398" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">3. Add it to the hypercare log</text><text x="688" y="424" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">4. Tell Ian at the next check</text><line x1="520" y1="190" x2="330" y2="270" stroke="#C8102E" stroke-width="3" marker-end="url(#a)"/><text x="400" y="225" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#C8102E" text-anchor="middle">yes</text><line x1="680" y1="190" x2="870" y2="270" stroke="#0F5C46" stroke-width="3" marker-end="url(#a)"/><text x="800" y="225" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F5C46" text-anchor="middle">no</text><rect x="60" y="480" width="1080" height="80" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="600" y="515" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F1B2D" text-anchor="middle">Never delete data to “fix” a problem. Evidence and history must be kept.</text><text x="600" y="543" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Stopping is safe and can be undone. Deleting cannot.</text></svg>