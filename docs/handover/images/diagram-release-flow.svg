<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">How a change reaches the website</title><desc id="d">A change moves from a branch to a pull request, passes automatic checks, is merged into main, and only then deployed to the owner’s Vercel account when the owner says yes.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="520" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">How a change reaches the real website</text><rect x="30" y="110" width="205" height="190" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="30" y="110" width="8" height="190" rx="4" fill="#1F5FBF"/><circle cx="66" cy="146" r="18" fill="#1F5FBF"/><text x="66" y="153" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="96" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Write it</text><text x="58" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">On a new branch,</text><text x="58" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">never on main</text><line x1="235" y1="205" x2="262" y2="205" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="262" y="110" width="205" height="190" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="262" y="110" width="8" height="190" rx="4" fill="#1F5FBF"/><circle cx="298" cy="146" r="18" fill="#1F5FBF"/><text x="298" y="153" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="328" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Open a PR</text><text x="290" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">A “pull request”</text><text x="290" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">asks for review</text><line x1="467" y1="205" x2="494" y2="205" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="494" y="110" width="205" height="190" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="494" y="110" width="8" height="190" rx="4" fill="#B7791F"/><circle cx="530" cy="146" r="18" fill="#B7791F"/><text x="530" y="153" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="560" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Auto-checks</text><text x="522" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">Lint, types, tests,</text><text x="522" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">build, browsers</text><line x1="699" y1="205" x2="726" y2="205" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="726" y="110" width="205" height="190" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="726" y="110" width="8" height="190" rx="4" fill="#0F5C46"/><circle cx="762" cy="146" r="18" fill="#0F5C46"/><text x="762" y="153" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="792" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Merge</text><text x="754" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">Into main after</text><text x="754" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">a person approves</text><line x1="931" y1="205" x2="958" y2="205" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="958" y="110" width="205" height="190" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="958" y="110" width="8" height="190" rx="4" fill="#C8102E"/><circle cx="994" cy="146" r="18" fill="#C8102E"/><text x="994" y="153" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1024" y="152" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Deploy</text><text x="986" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">Only when the owner</text><text x="986" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">says YES, to the</text><text x="986" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4E5A6E" text-anchor="start">owner’s Vercel</text><rect x="30" y="340" width="1140" height="150" rx="16" fill="#FFF5F6" stroke="#C8102E" stroke-width="2"/><text x="60" y="382" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#C8102E" text-anchor="start">Two rules that never bend</text><text x="60" y="418" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0F1B2D" text-anchor="start">1.  Code only goes to the project’s GitHub repository (1ndyg0/safecard-access-platform).</text><text x="60" y="452" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0F1B2D" text-anchor="start">2.  The live website is only ever changed from the owner’s own Vercel account, and only after a clear “yes, deploy”.</text></svg>