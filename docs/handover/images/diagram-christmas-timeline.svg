<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Christmas mode dates</title><desc id="d">The Christmas campaign switches on by itself on November 15, 2026, reminds people to apply by December 10, and switches off by itself on January 1, 2027.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="420" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">Christmas mode switches itself on and off</text><line x1="80" y1="190" x2="1120" y2="190" stroke="#C9D0DA" stroke-width="8" stroke-linecap="round"/><line x1="200" y1="190" x2="1000" y2="190" stroke="#0F5C46" stroke-width="12" stroke-linecap="round"/><circle cx="200" cy="190" r="20" fill="#0F5C46" stroke="#fff" stroke-width="5"/><text x="200" y="150" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F1B2D" text-anchor="middle">Nov 15, 2026</text><text x="200" y="250" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#4E5A6E" text-anchor="middle">Decorations appear</text><circle cx="700" cy="190" r="20" fill="#B7791F" stroke="#fff" stroke-width="5"/><text x="700" y="150" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F1B2D" text-anchor="middle">Dec 10</text><text x="700" y="250" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#4E5A6E" text-anchor="middle">“Apply by” date shown</text><circle cx="1000" cy="190" r="20" fill="#C8102E" stroke="#fff" stroke-width="5"/><text x="1000" y="150" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F1B2D" text-anchor="middle">Jan 1, 2027</text><text x="1000" y="250" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#4E5A6E" text-anchor="middle">Back to normal, by itself</text><rect x="80" y="300" width="1040" height="80" rx="14" fill="#FFF5F6" stroke="#C8102E" stroke-width="2"/><text x="600" y="335" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="middle">Emergency stop at any time: set NEXT_PUBLIC_SEASONAL_CAMPAIGN=off and redeploy.</text><text x="600" y="362" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Before launch you can preview with ?season=christmas on any page. Nothing else changes.</text></svg>