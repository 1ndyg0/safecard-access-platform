<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">The hypercare weeks</title><desc id="d">Four weeks of close watching after launch, with checks twice a day in week one, daily in weeks two and three, and every other day in week four.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F1B2D" text-anchor="middle">Hypercare: the first four weeks after real applicants arrive</text><rect x="30" y="100" width="262" height="330" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="30" y="100" width="262" height="64" rx="16" fill="#C8102E"/><rect x="30" y="140" width="262" height="24" fill="#C8102E"/><text x="161" y="143" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Week 1</text><text x="161" y="205" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#C8102E" text-anchor="middle">Twice a day</text><text x="161" y="248" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Morning + evening check</text><text x="161" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Review every application</text><text x="161" y="316" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">the same day</text><text x="161" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Two people watching</text><line x1="292" y1="265" x2="318" y2="265" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="318" y="100" width="262" height="330" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="318" y="100" width="262" height="64" rx="16" fill="#B7791F"/><rect x="318" y="140" width="262" height="24" fill="#B7791F"/><text x="449" y="143" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Week 2</text><text x="449" y="205" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#B7791F" text-anchor="middle">Once a day</text><text x="449" y="248" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Morning check</text><text x="449" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Review within 1 day</text><text x="449" y="316" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Note anything odd</text><text x="449" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">in the log</text><line x1="580" y1="265" x2="606" y2="265" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="606" y="100" width="262" height="330" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="606" y="100" width="262" height="64" rx="16" fill="#B7791F"/><rect x="606" y="140" width="262" height="24" fill="#B7791F"/><text x="737" y="143" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Week 3</text><text x="737" y="205" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#B7791F" text-anchor="middle">Once a day</text><text x="737" y="248" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Morning check</text><text x="737" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Review within 2 days</text><text x="737" y="316" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Look at the trend</text><text x="737" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">of questions</text><line x1="868" y1="265" x2="894" y2="265" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="894" y="100" width="262" height="330" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="894" y="100" width="262" height="64" rx="16" fill="#0F5C46"/><rect x="894" y="140" width="262" height="24" fill="#0F5C46"/><text x="1025" y="143" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Week 4</text><text x="1025" y="205" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F5C46" text-anchor="middle">Every other day</text><text x="1025" y="248" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Quick check</text><text x="1025" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Hold the exit review</text><text x="1025" y="316" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">Decide: end hypercare</text><text x="1025" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="middle">or extend</text><rect x="30" y="460" width="1140" height="100" rx="16" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F1B2D" text-anchor="start">Always, in every week:</text><text x="60" y="534" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0F1B2D" text-anchor="start">If something looks wrong, you do not need to understand it first. Press the Stop button (see the Runbook), then tell Ian.</text></svg>