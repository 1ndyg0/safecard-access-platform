<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">The big picture</title><desc id="d">People use the SafeCard website, which stores data in Supabase and is hosted on Vercel.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="640" fill="#fff"/><text x="600" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">The big picture: who touches what</text><rect x="40" y="100" width="300" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="100" width="8" height="150" rx="4" fill="#C8102E"/><text x="68" y="142" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Applicant</text><text x="68" y="176" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Learns about Safe Card,</text><text x="68" y="202" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">applies and pays</text><text x="68" y="228" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">on a phone or laptop</text><rect x="40" y="280" width="300" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="280" width="8" height="150" rx="4" fill="#0F5C46"/><text x="68" y="322" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Member</text><text x="68" y="356" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Checks status with</text><text x="68" y="382" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">reference + mobile number,</text><text x="68" y="408" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">shows the SafeCard</text><rect x="40" y="460" width="300" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="460" width="8" height="150" rx="4" fill="#1F5FBF"/><text x="68" y="502" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Administrator</text><text x="68" y="536" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Reviews each complete</text><text x="68" y="562" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">application and approves</text><text x="68" y="588" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">or rejects it</text><rect x="430" y="100" width="340" height="510" rx="18" fill="#FFF5F6" stroke="#C8102E" stroke-width="3"/><text x="600" y="142" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#C8102E" text-anchor="middle">SafeCard website</text><text x="600" y="170" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#4E5A6E" text-anchor="middle">hosted on Vercel</text><rect x="455" y="196" width="290" height="62" rx="12" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="475" y="223" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Public pages</text><text x="475" y="246" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4E5A6E" text-anchor="start">Home, Benefits, Help, Privacy</text><rect x="455" y="274" width="290" height="62" rx="12" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="475" y="301" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Application</text><text x="475" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4E5A6E" text-anchor="start">Step-by-step form</text><rect x="455" y="352" width="290" height="62" rx="12" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="475" y="379" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Member area</text><text x="475" y="402" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4E5A6E" text-anchor="start">Status and card</text><rect x="455" y="430" width="290" height="62" rx="12" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="475" y="457" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Admin area</text><text x="475" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4E5A6E" text-anchor="start">Review and decide</text><rect x="455" y="508" width="290" height="62" rx="12" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="475" y="535" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Safety rules</text><text x="475" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4E5A6E" text-anchor="start">Checks every request</text><rect x="880" y="100" width="280" height="230" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="880" y="100" width="8" height="230" rx="4" fill="#B7791F"/><text x="908" y="142" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Supabase</text><text x="908" y="176" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">The database: applications,</text><text x="908" y="202" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">people, decisions, logs.</text><text x="908" y="228" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Also the private vault for</text><text x="908" y="254" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">payment receipts.</text><rect x="880" y="380" width="280" height="230" rx="14" fill="#F2F3F5" stroke="#C9D0DA" stroke-width="2"/><rect x="880" y="380" width="8" height="230" rx="4" fill="#4E5A6E"/><text x="908" y="422" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Parked (off)</text><text x="908" y="456" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Text messages and emails</text><text x="908" y="482" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Direct GCash connection</text><text x="908" y="508" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Direct Red Cross system link</text><text x="908" y="534" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">These are not part of R1.</text><line x1="340" y1="175" x2="430" y2="250" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><line x1="340" y1="355" x2="430" y2="355" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><line x1="340" y1="535" x2="430" y2="460" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><line x1="770" y1="250" x2="880" y2="215" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><text x="825" y="252" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4E5A6E" text-anchor="middle">saves &amp;</text><text x="825" y="270" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4E5A6E" text-anchor="middle">reads</text><line x1="770" y1="480" x2="880" y2="495" stroke="#4E5A6E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/></svg>