<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">Who can do what</title><desc id="d">Four staff roles, from the accountable administrator to read-only support.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">Staff roles: give people only what they need</text><rect x="30" y="100" width="262" height="340" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="30" y="100" width="262" height="10" rx="5" fill="#C8102E"/><text x="161" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#C8102E" text-anchor="middle">privacy_admin_owner</text><text x="161" y="195" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="middle">The accountable administrator</text><text x="161" y="245" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Sees every field</text><text x="161" y="283" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Sees proofs of payment</text><text x="161" y="321" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Approves or rejects</text><text x="161" y="359" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Most closely audited</text><rect x="318" y="100" width="262" height="340" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="318" y="100" width="262" height="10" rx="5" fill="#1F5FBF"/><text x="449" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F5FBF" text-anchor="middle">school_admin</text><text x="449" y="195" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="middle">The application reviewer</text><text x="449" y="245" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Sees name, birthday, sex</text><text x="449" y="283" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Sees proofs of payment</text><text x="449" y="321" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Approves or rejects</text><text x="449" y="359" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Not mobile, email, address</text><rect x="606" y="100" width="262" height="340" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="606" y="100" width="262" height="10" rx="5" fill="#0F5C46"/><text x="737" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F5C46" text-anchor="middle">support_agent</text><text x="737" y="195" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="middle">Call-back helper</text><text x="737" y="245" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Sees name + contact</text><text x="737" y="283" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">No payment proofs</text><text x="737" y="321" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Cannot decide</text><text x="737" y="359" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Cannot see addresses</text><rect x="894" y="100" width="262" height="340" rx="16" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="894" y="100" width="262" height="10" rx="5" fill="#B7791F"/><text x="1025" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#B7791F" text-anchor="middle">content_approver</text><text x="1025" y="195" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="middle">Wording only</text><text x="1025" y="245" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">Approves the text</text><text x="1025" y="283" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">people read</text><text x="1025" y="321" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">No applicant data</text><text x="1025" y="359" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="middle">No decisions</text><rect x="30" y="470" width="1140" height="60" rx="12" fill="#FFF9E6" stroke="#B7791F" stroke-width="2"/><text x="600" y="507" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="middle">Roles are set by the setup script or by SQL. There is no staff-management screen in this release.</text></svg>