<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">The application journey</title><desc id="d">Seven steps from learning about Safe Card to receiving an approved card, with the administrator review in the middle.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="700" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">From “What is this?” to an approved SafeCard</text><rect x="40" y="90" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="90" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="76" cy="126" r="18" fill="#C8102E"/><text x="76" y="133" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="132" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Learn</text><text x="68" y="166" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Read what Safe Card</text><text x="68" y="192" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">covers and costs</text><line x1="380" y1="165" x2="425" y2="165" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="425" y="90" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="425" y="90" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="461" cy="126" r="18" fill="#C8102E"/><text x="461" y="133" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="491" y="132" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Check</text><text x="453" y="166" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Five quick questions</text><text x="453" y="192" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">to confirm you understand</text><line x1="765" y1="165" x2="810" y2="165" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="810" y="90" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="810" y="90" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="846" cy="126" r="18" fill="#C8102E"/><text x="846" y="133" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="876" y="132" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Decide</text><text x="838" y="166" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Choose to apply</text><text x="838" y="192" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">or to stop. Both are fine.</text><rect x="40" y="280" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="280" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="76" cy="316" r="18" fill="#C8102E"/><text x="76" y="323" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="322" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Consent</text><text x="68" y="356" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Read and tick the</text><text x="68" y="382" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">privacy boxes</text><line x1="380" y1="355" x2="425" y2="355" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="425" y="280" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="425" y="280" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="461" cy="316" r="18" fill="#C8102E"/><text x="461" y="323" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="491" y="322" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Details</text><text x="453" y="356" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Name, birthday,</text><text x="453" y="382" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">mobile, address</text><line x1="765" y1="355" x2="810" y2="355" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="810" y="280" width="340" height="150" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="810" y="280" width="8" height="150" rx="4" fill="#C8102E"/><circle cx="846" cy="316" r="18" fill="#C8102E"/><text x="846" y="323" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="876" y="322" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">Pay &amp; submit</text><text x="838" y="356" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Pay PHP 1,200, upload</text><text x="838" y="382" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">the receipt, send</text><path d="M980 240 L980 265 L210 265 L210 282" fill="none" stroke="#4E5A6E" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><line x1="1020" y1="430" x2="1020" y2="478" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="480" width="1120" height="190" rx="18" fill="#EEF4FF" stroke="#1F5FBF" stroke-width="2"/><text x="70" y="520" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1F5FBF" text-anchor="start">Then the Administrator reviews (usually within a few days)</text><rect x="70" y="545" width="300" height="105" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="70" y="545" width="8" height="105" rx="4" fill="#1F5FBF"/><text x="98" y="587" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Looks at the proof</text><text x="98" y="621" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Receipt, amount, date</text><rect x="450" y="545" width="300" height="105" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="450" y="545" width="8" height="105" rx="4" fill="#0F5C46"/><text x="478" y="587" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Approves</text><text x="478" y="621" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Also verifies payment</text><rect x="830" y="545" width="300" height="105" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="830" y="545" width="8" height="105" rx="4" fill="#C8102E"/><text x="858" y="587" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">Or rejects</text><text x="858" y="621" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Writes a clear reason</text><line x1="370" y1="597" x2="450" y2="597" stroke="#4E5A6E" stroke-width="3" marker-end="url(#a)"/><line x1="750" y1="597" x2="830" y2="597" stroke="#4E5A6E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="790" y="585" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4E5A6E" text-anchor="middle">or</text></svg>