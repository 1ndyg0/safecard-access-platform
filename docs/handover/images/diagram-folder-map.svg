<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d"><title id="t">A map of the project folders</title><desc id="d">The main folders of the project and what lives in each.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="660" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0F1B2D" text-anchor="middle">A map of the project (the parts you will actually meet)</text><rect x="40" y="90" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="90" width="8" height="108" rx="4" fill="#C8102E"/><text x="70" y="136" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#C8102E" text-anchor="start">src/app</text><text x="70" y="170" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">Every page and every API address</text><rect x="610" y="90" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="610" y="90" width="8" height="108" rx="4" fill="#C8102E"/><text x="640" y="136" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#C8102E" text-anchor="start">src/components</text><text x="640" y="170" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">The building blocks of the screens</text><rect x="40" y="218" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="218" width="8" height="108" rx="4" fill="#1F5FBF"/><text x="70" y="264" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1F5FBF" text-anchor="start">src/lib</text><text x="70" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">The rules and logic (safety, payment, admin)</text><rect x="610" y="218" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="610" y="218" width="8" height="108" rx="4" fill="#B7791F"/><text x="640" y="264" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#B7791F" text-anchor="start">supabase/migrations</text><text x="640" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">Numbered steps that build the database</text><rect x="40" y="346" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="346" width="8" height="108" rx="4" fill="#0F5C46"/><text x="70" y="392" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0F5C46" text-anchor="start">tests + e2e</text><text x="70" y="426" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">Robots that click through the site to check it</text><rect x="610" y="346" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="610" y="346" width="8" height="108" rx="4" fill="#4E5A6E"/><text x="640" y="392" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#4E5A6E" text-anchor="start">docs</text><text x="640" y="426" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">Written guides (this pack lives here)</text><rect x="40" y="474" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="40" y="474" width="8" height="108" rx="4" fill="#4E5A6E"/><text x="70" y="520" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#4E5A6E" text-anchor="start">scripts</text><text x="70" y="554" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">One-off helper commands, e.g. pilot setup</text><rect x="610" y="474" width="540" height="108" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><rect x="610" y="474" width="8" height="108" rx="4" fill="#4E5A6E"/><text x="640" y="520" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#4E5A6E" text-anchor="start">public</text><text x="640" y="554" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E5A6E" text-anchor="start">Images and files the site serves as-is</text></svg>