<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">The three safety switches</title><desc id="d">Three settings must all be in the live position for real applicants to be accepted. Any one in safe position keeps the site in practice mode.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#4E5A6E"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F1B2D" text-anchor="middle">Three switches decide if the site is “practice” or “real”</text><rect x="40" y="90" width="1120" height="110" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="70" y="132" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">NEXT_PUBLIC_DATA_MODE</text><text x="70" y="168" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Which kind of data is allowed</text><rect x="640" y="112" width="220" height="66" rx="33" fill="#E8F6F0" stroke="#0F5C46" stroke-width="3"/><text x="750" y="154" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F5C46" text-anchor="middle">SAFE: synthetic</text><rect x="900" y="112" width="220" height="66" rx="33" fill="#FFF0F2" stroke="#C8102E" stroke-width="3"/><text x="1010" y="154" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#C8102E" text-anchor="middle">LIVE: live</text><rect x="40" y="220" width="1120" height="110" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="70" y="262" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">LAUNCH_GATES_COMPLETE</text><text x="70" y="298" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">The humans said “we are ready”</text><rect x="640" y="242" width="220" height="66" rx="33" fill="#E8F6F0" stroke="#0F5C46" stroke-width="3"/><text x="750" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F5C46" text-anchor="middle">SAFE: false</text><rect x="900" y="242" width="220" height="66" rx="33" fill="#FFF0F2" stroke="#C8102E" stroke-width="3"/><text x="1010" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#C8102E" text-anchor="middle">LIVE: true</text><rect x="40" y="350" width="1120" height="110" rx="14" fill="#fff" stroke="#C9D0DA" stroke-width="2"/><text x="70" y="392" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">ENABLE_OFFICIAL_PAYMENT_HANDOFF</text><text x="70" y="428" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4E5A6E" text-anchor="start">Show the real payment details</text><rect x="640" y="372" width="220" height="66" rx="33" fill="#E8F6F0" stroke="#0F5C46" stroke-width="3"/><text x="750" y="414" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F5C46" text-anchor="middle">SAFE: false</text><rect x="900" y="372" width="220" height="66" rx="33" fill="#FFF0F2" stroke="#C8102E" stroke-width="3"/><text x="1010" y="414" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#C8102E" text-anchor="middle">LIVE: true</text><rect x="40" y="490" width="1120" height="54" rx="12" fill="#FFF9E6" stroke="#B7791F" stroke-width="2"/><text x="600" y="525" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="middle">Anything wrong? Put all three back to SAFE and redeploy. No real data is accepted.</text></svg>